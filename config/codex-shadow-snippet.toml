# Merge these fields into the existing Robinhood MCP block in ~/.codex/config.toml.
# Do not create a duplicate block.
# Keep the server disabled while reviewing the local configuration and this repository.
# Change enabled to true only after both the local configuration review and repository audit pass.

[mcp_servers."robinhood-trading"]
url = "https://agent.robinhood.com/mcp/trading"
auth = "oauth"
enabled = false
required = true
startup_timeout_sec = 20
tool_timeout_sec = 60
default_tools_approval_mode = "auto"

enabled_tools = [
  "get_equity_historicals",
  "get_equity_quotes",
  "get_index_quotes",
  "get_option_chains",
  "get_option_instruments",
  "get_option_quotes"
]
